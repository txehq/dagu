# Planted leak (inert fake data): credential keys whose values YAML resolves
# to bools (true, unquoted yes). Ordinary flags beside them stay clean; the
# credential keys must still fail the check.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-planted-boolean
data:
  dagu.yaml: |
    auth:
      mode: "basic"
      proxy:
        enabled: true
      basic:
        password: true
    license:
      key: yes
