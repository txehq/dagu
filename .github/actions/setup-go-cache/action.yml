name: Set up Go with the CI build cache
description: >-
  Installs Go and restores the module and build caches last saved from main, so
  a job compiles only what changed since then. The action never saves; the job
  that owns the cache runs scripts/ci/trim-go-cache.sh, then saves it with
  actions/cache/save and the outputs below.
  On Windows it also moves the Go caches and TEMP to the D: drive for the rest
  of the job, and starts Chrome once so that the job's first browser does not
  load Chrome from a cold C: drive.

inputs:
  go-version:
    description: Go version to install.
    required: true
  cache-name:
    description: >-
      Name of the cache to restore. Jobs that build differently, such as the
      linters for each GOOS, keep a cache of their own.
    default: go-test

outputs:
  cache-paths:
    description: Directories that make up the cache.
    value: ${{ steps.paths.outputs.paths }}
  cache-key:
    description: Key to save the cache under for this commit.
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    # The runner's D: drive is a local disk, far faster than the C: system
    # drive that holds the Go caches and temporary files by default.
    - name: Use the D drive
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        @(
          "GOCACHE=D:\go\cache"
          "GOMODCACHE=D:\go\mod"
          "TEMP=$env:RUNNER_TEMP"
          "TMP=$env:RUNNER_TEMP"
        ) | Add-Content -Path $env:GITHUB_ENV

    # A fresh runner has never read Chrome's files, nor the system files
    # Chrome loads, from its C: drive. Read cold while a test step starts,
    # under the I/O of go test and its first packages, they came in at
    # 12-15 MB/s with reads of about a second: the unit shard's first four
    # Chromes took 22-47 s to answer their DevTools pipe and could miss the
    # gate's 60 s start-up window (TXE-7834). Reading Chrome's install folder
    # first still left one VM in nine at 10 s, as Chrome's cold set reaches
    # outside its folder. One Chrome started here alone, while the disk is
    # idle, takes about 5 s, and every launch after it answered within 2 s.
    # Every Windows job that sets up Go starts it, so a new job that starts
    # Chrome cannot leave this out (internal/test/chrometest checks it).
    - name: Start Chrome once
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $dirs = @()
        if ($env:CHROME_PATH) {
          $chrome = $env:CHROME_PATH
        } else {
          foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:LOCALAPPDATA)) {
            if ($root) { $dirs += Join-Path $root 'Google\Chrome\Application' }
          }
          $chrome = $dirs | ForEach-Object { Join-Path $_ 'chrome.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
        }
        if (-not $chrome -or -not (Test-Path $chrome)) {
          Write-Output "No Chrome found (CHROME_PATH or $($dirs -join '; ')); nothing to start"
          exit 0
        }
        # A profile of its own, which no test uses. It is left in RUNNER_TEMP,
        # which the runner empties after the job: nothing here deletes a path.
        $userDataDir = Join-Path $env:RUNNER_TEMP ("warm-chrome-" + [guid]::NewGuid().ToString('N'))
        New-Item -ItemType Directory -Path $userDataDir | Out-Null
        $chromeArgs = @('--headless', '--no-sandbox', '--no-first-run', '--no-default-browser-check',
          '--disable-background-networking', '--disable-component-update',
          "--user-data-dir=`"$userDataDir`"", '--dump-dom', 'about:blank')
        $watch = [Diagnostics.Stopwatch]::StartNew()
        $process = Start-Process -FilePath $chrome -ArgumentList $chromeArgs -PassThru -WindowStyle Hidden `
          -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'warm-chrome.out') `
          -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'warm-chrome.err')
        $null = $process.Handle # keeps the exit code readable after the exit
        if (-not $process.WaitForExit(120000)) {
          $process.Kill($true)
          throw "Chrome did not exit within 120 s of starting"
        }
        $process.WaitForExit()
        if ($process.ExitCode -ne 0) {
          throw "Chrome exited with code $($process.ExitCode)"
        }
        # Chrome's helper processes leave after the browser; none may be left
        # holding the profile's files when the tests start. Only whether a
        # process names this profile is read; no command line is printed.
        $left = @()
        foreach ($i in 1..60) {
          $left = @(Get-CimInstance Win32_Process -Filter "Name = 'chrome.exe'" |
            Where-Object { $_.CommandLine -and $_.CommandLine.Contains($userDataDir) })
          if ($left.Count -eq 0) { break }
          Start-Sleep -Milliseconds 500
        }
        if ($left.Count -ne 0) {
          throw "$($left.Count) Chrome processes of the warm-up profile were still running 30 s after it exited"
        }
        Write-Output ("Started Chrome {0} once in {1:N1} s" -f (Get-Item $chrome).VersionInfo.ProductVersion, $watch.Elapsed.TotalSeconds)

    # Marks the job start, an hour early, for trim-go-cache.sh: Go refreshes
    # the time of an entry it uses once that time is an hour old, so an
    # entry no newer than the mark when the cache is saved went unused.
    - name: Mark the job start
      shell: bash
      run: touch -d '61 minutes ago' "${RUNNER_TEMP}/go-cache-epoch"

    - name: Install Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ inputs.go-version }}
        # The built-in cache is keyed on go.sum alone, so the first job to
        # finish saves it once and later commits restore a stale build cache.
        cache: false

    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        {
          echo "paths<<EOF"
          go env GOCACHE GOMODCACHE
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Compute cache key
      id: key
      shell: bash
      run: |
        prefix="${{ inputs.cache-name }}-${RUNNER_OS}-${{ hashFiles('go.sum') }}-"
        {
          echo "prefix=${prefix}"
          echo "key=${prefix}${GITHUB_SHA}"
        } >> "${GITHUB_OUTPUT}"

    - name: Restore Go caches
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}
          ${{ inputs.cache-name }}-${{ runner.os }}-
