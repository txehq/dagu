name: Set up Go with the CI build cache
description: >-
  Installs Go and restores the module and build caches last saved from main, so
  a job compiles only what changed since then. The action never saves; the job
  that owns the cache runs scripts/ci/trim-go-cache.sh, then saves it with
  actions/cache/save and the outputs below.
  On Windows it also moves the Go caches and TEMP to the D: drive for the rest
  of the job, and reads Chrome's files once so that the job's first browser
  does not load them from a cold C: drive.

inputs:
  go-version:
    description: Go version to install.
    required: true
  cache-name:
    description: >-
      Name of the cache to restore. Jobs that build differently, such as the
      linters for each GOOS, keep a cache of their own.
    default: go-test

outputs:
  cache-paths:
    description: Directories that make up the cache.
    value: ${{ steps.paths.outputs.paths }}
  cache-key:
    description: Key to save the cache under for this commit.
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    # The runner's D: drive is a local disk, far faster than the C: system
    # drive that holds the Go caches and temporary files by default.
    - name: Use the D drive
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        @(
          "GOCACHE=D:\go\cache"
          "GOMODCACHE=D:\go\mod"
          "TEMP=$env:RUNNER_TEMP"
          "TMP=$env:RUNNER_TEMP"
        ) | Add-Content -Path $env:GITHUB_ENV

    # Chrome lives on the C: drive, and a fresh runner has never read its
    # files. Read cold while a test step starts, under the I/O of go test
    # and its first packages, they came in at 12-15 MB/s with reads taking
    # about a second each. Chrome then needed 22-47 s just to load and did
    # not answer its DevTools pipe in time (TXE-7834: the first four
    # launches of the unit shard on 2 of 3 VMs). One sequential read here,
    # while the disk is idle, takes 5-13 s. After it, every launch in the
    # shard answered within 1.4 s. Every Windows job that sets up Go reads
    # Chrome here, so a new job that starts Chrome cannot leave this out.
    - name: Read Chrome's files once
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $dirs = @()
        if ($env:CHROME_PATH) {
          $dirs += Split-Path -Parent $env:CHROME_PATH
        } else {
          foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:LOCALAPPDATA)) {
            if ($root) { $dirs += Join-Path $root 'Google\Chrome\Application' }
          }
        }
        $dir = $dirs | Where-Object { Test-Path (Join-Path $_ 'chrome.exe') } | Select-Object -First 1
        if (-not $dir) {
          Write-Output "No Chrome found in: $($dirs -join '; ')"
          exit 0
        }
        $watch = [Diagnostics.Stopwatch]::StartNew()
        $bytes = 0
        $buffer = New-Object byte[] (1MB)
        foreach ($file in Get-ChildItem -LiteralPath $dir -Recurse -File) {
          $stream = [IO.File]::OpenRead($file.FullName)
          try {
            while (($n = $stream.Read($buffer, 0, $buffer.Length)) -gt 0) { $bytes += $n }
          } finally {
            $stream.Dispose()
          }
        }
        Write-Output ("Read {0:N0} bytes of {1} in {2:N1} s" -f $bytes, $dir, $watch.Elapsed.TotalSeconds)

    # Marks the job start, an hour early, for trim-go-cache.sh: Go refreshes
    # the time of an entry it uses once that time is an hour old, so an
    # entry no newer than the mark when the cache is saved went unused.
    - name: Mark the job start
      shell: bash
      run: touch -d '61 minutes ago' "${RUNNER_TEMP}/go-cache-epoch"

    - name: Install Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ inputs.go-version }}
        # The built-in cache is keyed on go.sum alone, so the first job to
        # finish saves it once and later commits restore a stale build cache.
        cache: false

    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        {
          echo "paths<<EOF"
          go env GOCACHE GOMODCACHE
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Compute cache key
      id: key
      shell: bash
      run: |
        prefix="${{ inputs.cache-name }}-${RUNNER_OS}-${{ hashFiles('go.sum') }}-"
        {
          echo "prefix=${prefix}"
          echo "key=${prefix}${GITHUB_SHA}"
        } >> "${GITHUB_OUTPUT}"

    - name: Restore Go caches
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}
          ${{ inputs.cache-name }}-${{ runner.os }}-
