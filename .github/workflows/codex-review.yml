name: codex-review

# The review gate of this fork (TXE-4719): `codex-review` is success when the Codex GitHub
# connector has completed a review of the PR's current head with no P0 or P1 finding, or a person
# added the `review-override` label. The rule and its reasons are .github/codex-review/
# codex-review-check.sh, ported from txehq/txe ops/ci/codex-review-check.sh (TXE-4664, TXE-4666);
# this file only decides when it runs. The connector (GitHub App chatgpt-codex-connector, its
# repository setting "All PRs") is expected to start a review on its own; when none starts within a
# few minutes of a new head, the author comments `@codex review` once for that head (README.md).
#
# It replaces the Tokun-backed review workflow (TXE-4204), which stopped on 2026-10-20 when the
# Tokun account ran out of balance (TXE-4714). Nothing here holds a secret.
#
# THIS REPOSITORY IS PUBLIC, so the gate runs MAIN's copy: pull_request_target executes this file
# and the script as they are on main, never the PR's, so a PR (from a fork or not) cannot edit what
# judges it. That is safe here because the job never checks out or runs anything from the PR: it
# checks out main's .github/codex-review only and reads the PR through the API, with a read-only
# token and no secret. A PR from another repository still fails unless a person adds
# `review-override` (rule 0 in the script). The PR that introduces this file is judged by the
# previous main's workflow, so it was merged on an independent review (README.md, bootstrap).
#
# TRIGGERS. A push, a new or reopened PR and a draft marked ready make a connector review; `edited`
# covers a change of base; `labeled`/`unlabeled` re-judge when `review-override` is added or
# removed, so removing it revokes a pass. No pull_request_review trigger: that event runs the PR's
# copy of the workflow. A connector review with findings lands while the push's run is polling
# (30 s, up to 15 min), and a clean pass edits a comment and reacts, which fires no event. If a
# review completes after the poll ended, re-run the check. Drafts are skipped: the connector does
# not review a draft.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]
    # The gate is main's copy only: on another base, github.sha would be that branch's scripts.
    branches: [main]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  codex-review:
    name: codex-review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Main's scripts only (pull_request_target's default ref), never the PR's head or merge ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/codex-review

      - name: Test the check over recorded connector payloads
        run: bash .github/codex-review/test-codex-review-check.sh

      - name: Check the connector's review of the head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CODEX_REVIEW_WAIT_SECONDS: "900"
        run: bash .github/codex-review/codex-review-check.sh
