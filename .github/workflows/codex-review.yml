name: codex-review

# The review gate of this fork (TXE-4719): `codex-review` is success when the Codex GitHub
# connector has completed a review of the PR's current head with no P0 or P1 finding, or a person
# added the `review-override` label. The rule and its reasons are .github/codex-review/
# codex-review-check.sh, ported from txehq/txe ops/ci/codex-review-check.sh (TXE-4664, TXE-4666);
# this file only decides when it runs. The connector itself reviews each push: it is the GitHub
# App chatgpt-codex-connector, with automatic review on every push for this repository.
#
# It replaces the Tokun-backed review workflow (TXE-4204), which stopped on 2026-10-20 when the
# Tokun account ran out of balance (TXE-4714). Nothing here holds a secret.
#
# THIS REPOSITORY IS PUBLIC. A pull_request run executes the PR's OWN copy of this file and of the
# script, with a read-only token. For a PR from a branch of this repository that copy is the one
# under review; a PR from another repository could change it, so the script fails every such PR
# unless a person adds `review-override`, and the merge re-runs main's copy of the script with
# CODEX_REVIEW_WAIT_SECONDS=0 (.github/codex-review/README.md).
#
# TRIGGERS, as txe's: a push, a new PR and a draft marked ready make a connector review; a
# submitted or dismissed review changes its findings; `edited` covers a change of base. Never
# `labeled`: adding `review-override` runs nothing by itself, so re-run this check after adding it.
# Every event polls (30 s, up to 15 min): a clean pass edits a comment and reacts, which fires no
# event here. Drafts are skipped: the connector does not review a draft.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  codex-review:
    name: codex-review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test the check over recorded connector payloads
        run: bash .github/codex-review/test-codex-review-check.sh

      - name: Check the connector's review of the head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CODEX_REVIEW_WAIT_SECONDS: "900"
        run: bash .github/codex-review/codex-review-check.sh
