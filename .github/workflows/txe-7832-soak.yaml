# TXE-7832 soak only, removed before the PR is ready for review: runs the
# browser and desktop tests that flaked on hosted runners many times, beside
# a unit shard for the load CI puts on them, with main's production files
# (base) and with this branch's (fix), and logs their measured latencies.
name: TXE-7832 soak

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GO_VERSION: 1.27.3

jobs:
  soak-windows:
    name: Soak on windows-latest (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [fix]
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Use main's production files
        if: ${{ matrix.variant == 'base' }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          git checkout FETCH_HEAD -- internal/browserhost/devtoolsgate/mux.go internal/browserhost/devtoolsgate/launch.go internal/browserhost/devtoolsgate/main.go
          git status --short

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build (Windows)
        shell: bash
        run: |
          mkdir -p ./.local/bin
          go build -o ./.local/bin/dagu.exe ./cmd
          go test -count=1 -run '^$' ./internal/browserhost/writegate ./internal/desktop ./internal/runtime/builtin/browser

      - name: Soak beside a unit shard
        shell: bash
        run: |
          scripts/ci/go-test-suite.sh unit 1 2 > "${RUNNER_TEMP}/plan.tsv"
          (
            while IFS=$'\t' read -r -u 3 packages run; do
              args=(-timeout=20m -count=1)
              if [[ -n "${run}" ]]; then
                args+=(-run "${run}")
              fi
              # shellcheck disable=SC2086 # packages is a space-separated list.
              go test "${args[@]}" ${packages} > /dev/null 2>&1 || true
            done 3< "${RUNNER_TEMP}/plan.tsv"
          ) &
          load=$!
          status=0
          go test -timeout=40m -count=30 -v -run '^(TestAttendedBrowserOutlivesTheUnattendedCap|TestGateSeesASocketAWorkerOpensAtStart|TestBrowserWithOnlyItsWriteGateEndsWhenUnattended)$' ./internal/browserhost/writegate 2>&1 | grep -E 'TXE7832-SOAK|^(--- |ok|FAIL|panic)|gate_test.go' || status=1
          go test -timeout=20m -count=12 -v -run '^(TestSoakStagehandKillLatency|TestStagehandReportsBrowserProcess)$' ./internal/runtime/builtin/browser 2>&1 | grep -E 'TXE7832-SOAK|^(--- |ok|FAIL|panic)|stagehand_test.go' || status=1
          go test -timeout=20m -count=25 -v -run '^(TestSoakActAlonePhases|TestOpenElementsCloses)$' ./internal/desktop 2>&1 | grep -E 'TXE7832-SOAK|^(--- |ok|FAIL|panic)|elements_windows_test.go|in chain' || status=1
          kill "${load}" 2>/dev/null || true
          exit "${status}"

  soak-ubuntu:
    name: Soak on ubuntu-latest (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [base, fix]
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Use main's production files
        if: ${{ matrix.variant == 'base' }}
        run: |
          git fetch --no-tags --depth=1 origin main
          git checkout FETCH_HEAD -- internal/browserhost/devtoolsgate/mux.go internal/browserhost/devtoolsgate/launch.go internal/browserhost/devtoolsgate/main.go
          git status --short

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: |
          make bin
          go test -race -count=1 -run '^$' ./internal/browserhost/writegate ./internal/runtime/builtin/browser

      - name: Soak beside a unit shard
        shell: bash
        run: |
          scripts/ci/go-test-suite.sh unit 1 3 > "${RUNNER_TEMP}/plan.tsv"
          (
            while IFS=$'\t' read -r -u 3 packages run; do
              args=(-race -count=1)
              if [[ -n "${run}" ]]; then
                args+=(-run "${run}")
              fi
              # shellcheck disable=SC2086 # packages is a space-separated list.
              go test "${args[@]}" ${packages} > /dev/null 2>&1 || true
            done 3< "${RUNNER_TEMP}/plan.tsv"
          ) &
          load=$!
          status=0
          go test -race -timeout=40m -count=120 -v -run '^(TestGateSeesASocketAWorkerOpensAtStart|TestGateRefusesSockets)$' ./internal/browserhost/writegate 2>&1 | grep -E 'TXE7832-SOAK|^(--- |ok|FAIL|panic)|gate_test.go' || status=1
          go test -race -timeout=20m -count=8 -v -run '^(TestSoakStagehandKillLatency|TestStagehandReportsBrowserProcess)$' ./internal/runtime/builtin/browser 2>&1 | grep -E 'TXE7832-SOAK|^(--- |ok|FAIL|panic)|stagehand_test.go' || status=1
          kill "${load}" 2>/dev/null || true
          exit "${status}"
