# TEMPORARY soak for TXE-7834; removed before the PR leaves draft.
name: TXE-7834 soak (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/txe-7834-soak.yaml
      - internal/browserhost/devtoolsgate/**

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"

jobs:
  soak:
    name: soak ${{ matrix.order }} ${{ matrix.n }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        order: [probe-first, shard-first, prewarm-first]
        n: [1, 2, 3]
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Before anything else touches Chrome or the disks.
      - name: Start the sampler
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "txe7834"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $counters = @(
            '\Processor(_Total)\% Processor Time',
            '\System\Processor Queue Length',
            '\Memory\Available MBytes',
            '\PhysicalDisk(*)\Current Disk Queue Length',
            '\PhysicalDisk(*)\Disk Read Bytes/sec',
            '\PhysicalDisk(*)\Avg. Disk sec/Read',
            '\Process(chrome)\% Processor Time'
          )
          $tpArgs = @($counters | ForEach-Object { "`"$_`"" }) + @("-si", "1", "-sc", "1800", "-f", "CSV", "-o", "`"$(Join-Path $out typeperf.csv)`"", "-y")
          Start-Process -FilePath typeperf -ArgumentList $tpArgs -WindowStyle Hidden
          "cpus=$env:NUMBER_OF_PROCESSORS" | Tee-Object -FilePath (Join-Path $out 'host.txt')
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize | Out-String | Tee-Object -FilePath (Join-Path $out 'host.txt') -Append
          try { Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AntivirusEnabled,AMRunningMode | Format-List | Out-String | Tee-Object -FilePath (Join-Path $out 'host.txt') -Append } catch { "no Defender status: $_" }
          try { (Get-MpPreference).ExclusionPath -join ';' | Tee-Object -FilePath (Join-Path $out 'host.txt') -Append } catch { "no Defender prefs" }
          Get-Service | Where-Object { $_.Name -match 'Chrome|gupdate|GoogleUpdater|FontCache' } | Format-Table Name,Status,StartType -AutoSize | Out-String | Tee-Object -FilePath (Join-Path $out 'host.txt') -Append
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          (Get-Item $chrome).VersionInfo.ProductVersion | Tee-Object -FilePath (Join-Path $out 'host.txt') -Append
          "uptime-s=$([int]((Get-Date) - (Get-CimInstance Win32_OperatingSystem).LastBootUpTime).TotalSeconds)" | Tee-Object -FilePath (Join-Path $out 'host.txt') -Append

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Plan test shard
        shell: bash
        run: scripts/ci/go-test-suite.sh unit 1 2 > "${RUNNER_TEMP}/go-test-plan.tsv"

      - name: Build (Windows)
        shell: bash
        run: |
          mkdir -p ./.local/bin
          go build -o ./.local/bin/dagu.exe ./cmd
          go test -c -o "${RUNNER_TEMP}/devtoolsgate.test.exe" ./internal/browserhost/devtoolsgate

      - name: Prewarm Chrome's files
        if: matrix.order == 'prewarm-first'
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $bytes = 0
          Get-ChildItem -Recurse -File 'C:\Program Files\Google\Chrome\Application' | ForEach-Object {
            $bytes += ([IO.File]::ReadAllBytes($_.FullName)).Length
          }
          "prewarm bytes=$bytes ms=$($sw.ElapsedMilliseconds)" | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'txe7834\host.txt') -Append

      - name: Probe (before the shard)
        if: matrix.order != 'shard-first'
        shell: bash
        env:
          TXE7834_PROBE: "1"
          TXE7834_PROBE_ROUNDS: "10"
          TXE7834_CHROME_V: "1"
        run: |
          export TXE7834_TRACE_DIR="${RUNNER_TEMP}/txe7834/probe-before"
          mkdir -p "${TXE7834_TRACE_DIR}"
          "${RUNNER_TEMP}/devtoolsgate.test.exe" -test.run '^TestTXE7834Probe$' -test.v -test.timeout 15m | tee "${TXE7834_TRACE_DIR}/probe.txt"

      - name: Test unit 1/2 with the trace
        shell: bash
        run: |
          export TXE7834_TRACE_DIR="${RUNNER_TEMP}/txe7834/shard"
          mkdir -p "${TXE7834_TRACE_DIR}"
          status=0
          while IFS=$'\t' read -r -u 3 packages run; do
            args=(-timeout=20m -count=1)
            if [[ -n "${run}" ]]; then
              args+=(-run "${run}")
            fi
            # shellcheck disable=SC2086 # packages is a space-separated list.
            go test "${args[@]}" ${packages} 2>&1 | tee -a "${TXE7834_TRACE_DIR}/go-test.txt" || status=1
          done 3< "${RUNNER_TEMP}/go-test-plan.tsv"
          echo "shard status=${status}"

      - name: Probe (after the shard)
        if: matrix.order == 'shard-first'
        shell: bash
        env:
          TXE7834_PROBE: "1"
          TXE7834_PROBE_ROUNDS: "10"
          TXE7834_CHROME_V: "1"
        run: |
          export TXE7834_TRACE_DIR="${RUNNER_TEMP}/txe7834/probe-after"
          mkdir -p "${TXE7834_TRACE_DIR}"
          "${RUNNER_TEMP}/devtoolsgate.test.exe" -test.run '^TestTXE7834Probe$' -test.v -test.timeout 15m | tee "${TXE7834_TRACE_DIR}/probe.txt"

      - name: Stop the sampler
        if: always()
        shell: pwsh
        run: Get-Process typeperf -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Upload the trace
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: txe7834-${{ matrix.order }}-${{ matrix.n }}
          path: ${{ runner.temp }}/txe7834
          retention-days: 7
