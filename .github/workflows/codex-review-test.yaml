name: codex-review-test

# Tests for .github/codex-review (TXE-4719): the connector check over recorded payloads, and
# shellcheck. The PR's own copy runs with no secret and a read-only token.

on:
  pull_request:
    paths:
      - '.github/codex-review/**'
      - '.github/workflows/codex-review.yml'
      - '.github/workflows/codex-review-test.yaml'
  push:
    branches: [main]
    paths:
      - '.github/codex-review/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Shellcheck
        run: shellcheck .github/codex-review/*.sh
      - name: The check over recorded connector payloads
        run: bash .github/codex-review/test-codex-review-check.sh
