name: codex-review-test

# Tests for .github/codex-review (TXE-4719): the connector check over recorded payloads, and
# the merge wrapper, the gate's maintenance-base pin (TXE-7556), and shellcheck. The PR's own copy
# runs with no secret and a read-only token.

on:
  pull_request:
    paths:
      - '.github/codex-review/**'
      - '.github/workflows/codex-review.yml'
      - '.github/workflows/codex-review-test.yaml'
  push:
    branches: [main]
    paths:
      - '.github/codex-review/**'
      - '.github/workflows/codex-review.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # main's history: the gate pin must be a main commit with main's copy of what the gate runs.
          fetch-depth: 0
      - name: Shellcheck
        run: shellcheck .github/codex-review/*.sh
      - name: The check over recorded connector payloads
        run: bash .github/codex-review/test-codex-review-check.sh
      - name: The merge wrapper with a stand-in gh
        run: bash .github/codex-review/test-merge.sh
      - name: The merge wrapper's merge methods over a real git history
        run: bash .github/codex-review/test-merge-git.sh
      - name: The gate's maintenance-base pin is a main commit, current with main
        run: bash .github/codex-review/test-gate-pin.sh origin/main
      - name: The fixture sanitizer keeps no private text
        run: python3 -I .github/codex-review/testdata/test_sanitize.py
